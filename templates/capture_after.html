{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-center align-items-center" style="min-height: 90vh;">
    <div class="w-100" style="max-width: 900px;">
        <h3 class="text-center mb-4">
            Сделайте захват изображения <span class="text-danger">ПОСЛЕ</span> стрельбы
        </h3>
        <form method="post" id="after-form">
            <div class="d-flex justify-content-center">
                <video id="video-after" width="1280" height="720" autoplay style="border:2px solid #333; border-radius:10px;"></video>
            </div>
            <div class="d-flex justify-content-center mt-3">
                <button type="button" class="btn btn-primary w-50" id="capture-after">
                    Сделать снимок ПОСЛЕ
                </button>
            </div>
            <canvas id="canvas-after" width="1280" height="720" style="display:none;"></canvas>
            <input type="hidden" name="image_after" id="image_after">
        </form>
    </div>
</div>
<script>
    const video = document.getElementById('video-after');
    const canvas = document.getElementById('canvas-after');
    const captureBtn = document.getElementById('capture-after');
    const imageInput = document.getElementById('image_after');
    const form = document.getElementById('after-form');

    navigator.mediaDevices.getUserMedia({
        video: { width: { ideal: 1280 }, height: { ideal: 720 } }
    })
        .then(stream => { video.srcObject = stream; })
        .catch(err => { alert('Ошибка доступа к камере: ' + err); });

    captureBtn.onclick = function() {
        canvas.getContext('2d').drawImage(video, 0, 0, 1280, 720);
        imageInput.value = canvas.toDataURL('image/jpeg', 0.8);
        let tracks = video.srcObject.getTracks();
        tracks.forEach(track => track.stop());
        // Сразу отправляем форму после захвата
        form.submit();
    };
</script>
{% endblock %}
