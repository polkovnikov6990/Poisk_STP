{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-center align-items-center" style="min-height: 90vh;">
    <div class="w-100" style="max-width: 900px;">
        <h3 class="text-center mb-4">
            Сделайте захват изображения <span class="text-primary">ДО</span> стрельбы
        </h3>
        <form method="post" id="before-form">
            <div class="d-flex justify-content-center">
                <video id="video-before" width="1280" height="720" autoplay style="border:2px solid #333; border-radius:10px;"></video>
            </div>
            <div class="d-flex justify-content-center mt-3">
                <button type="button" class="btn btn-primary w-50" id="capture-before">
                    Сделать снимок ДО
                </button>
            </div>
            <canvas id="canvas-before" width="1280" height="720" style="display:none;"></canvas>
            <input type="hidden" name="image_before" id="image_before">
        </form>
    </div>
</div>
<script>
    const video = document.getElementById('video-before');
    const canvas = document.getElementById('canvas-before');
    const captureBtn = document.getElementById('capture-before');
    const imageInput = document.getElementById('image_before');
    const form = document.getElementById('before-form');

    navigator.mediaDevices.getUserMedia({
        video: { width: { ideal: 1280 }, height: { ideal: 720 } }
    })
        .then(stream => { video.srcObject = stream; })
        .catch(err => { alert('Ошибка доступа к камере: ' + err); });

    captureBtn.onclick = function() {
        canvas.getContext('2d').drawImage(video, 0, 0, 1280, 720);
        imageInput.value = canvas.toDataURL('image/jpeg', 0.8);
        let tracks = video.srcObject.getTracks();
        tracks.forEach(track => track.stop());
        // Сразу отправляем форму после захвата
        form.submit();
    };
</script>
{% endblock %}
